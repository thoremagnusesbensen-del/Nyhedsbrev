name: Dagligt Nyhedsbrev

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 08:00 dansk tid (UTC+2 sommer)
  workflow_dispatch:        # Tillader manuel kørsel fra GitHub UI

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dependencies
        run: pip install feedparser requests beautifulsoup4 python-dotenv

      - name: Opret .env fra secrets
        run: |
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "NEWSLETTER_TO=thoremagnusesbensen@gmail.com" >> .env

      - name: Kør nyhedsbrev
        run: python execution/run_daily_newsletter.py
